services:
  database:
    build: ./database
    env_file:
      - .env
    volumes:
      - db-data:/data/db
    networks:
      - backend-net
  frontend:
    build: ./frontend
    ports:
      - 80:80
      - 443:443
    networks:
      - frontend-net
    depends_on:
      - backend1
      - backend2
      - backend3
  backend1:
    build: ./backend
    env_file:
      - .env
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - database
  backend2:
    build: ./backend
    env_file:
      - .env
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - database
  backend3:
    build: ./backend
    env_file:
      - .env
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - database
volumes:
  db-data:
networks:
  backend-net:
  frontend-net:

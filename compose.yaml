services:
  database:
    image: mongo:8.0
    volumes:
      - db-data:/data/db
    env_file:
      - ./backend/.env
    networks:
      - backend-net
  backend:
    build: ./backend
    ports:
      - 8000:8000
    networks:
      - backend-net
      - frontend-net
    env_file:
      - ./backend/.env
    depends_on:
      - database
  frontend:
    build: ./frontend
    ports:
      - 80:80
    networks:
      - frontend-net
    depends_on:
      - backend
volumes:
  db-data:
networks:
  backend-net:
  frontend-net:
